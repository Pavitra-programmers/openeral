name: Publish sandbox image

on:
  push:
    branches: [nemo]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/openeral-fused/**'
      - 'Dockerfile.openrind-shell'
      - 'Dockerfile.openrind-shell-compat'
      - 'openeral-js/**'
      - '.claude/skills/**'
      - '.dockerignore'
      - 'sandboxes/openeral/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_REPO_BASE: ghcr.io/openrind/openrind-shell

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openrind
          POSTGRES_PASSWORD: openrind
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openrind"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: openeral-js
        run: pnpm install

      - name: Typecheck
        working-directory: openeral-js
        run: pnpm typecheck

      - name: Lint
        working-directory: openeral-js
        run: pnpm lint

      - name: Unit tests
        working-directory: openeral-js
        run: pnpm test

      - name: Build
        working-directory: openeral-js
        run: pnpm build

      - name: Integration tests
        working-directory: openeral-js
        env:
          DATABASE_URL: postgresql://openrind:openrind@localhost:5432/testdb
        run: node test-integration.mjs

      - name: Check FUSE daemon
        run: cargo test -p openeral-fused

  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: fuse
            dockerfile: Dockerfile.openrind-shell
            tag: fuse
          - runtime: compatibility
            dockerfile: Dockerfile.openrind-shell-compat
            tag: just-bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.runtime }} sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_REPO_BASE }}/sandbox:${{ matrix.tag }}
            ${{ env.IMAGE_REPO_BASE }}/sandbox:${{ matrix.tag }}-sha-${{ github.sha }}
          cache-from: type=gha,scope=sandbox-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=sandbox-${{ matrix.tag }}
