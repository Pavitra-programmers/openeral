name: Publish matched Haloop images

on:
  workflow_dispatch:
    inputs:
      haloop_commit:
        description: Full reviewed commit SHA from openrind/w8-haloop
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-haloop-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require immutable source
        env:
          HALOOP_COMMIT: ${{ inputs.haloop_commit }}
        run: '[[ "$HALOOP_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: openrind/w8-haloop
          ref: ${{ inputs.haloop_commit }}
          path: haloop-source
          # GITHUB_TOKEN cannot read a different private repository.
          token: ${{ secrets.HALOOP_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify both images before publishing
        run: node openrind-desktop/apps/desktop/scripts/publish-haloop-images.mjs haloop-source
      - name: Verify anonymous customer pulls
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          node openrind-desktop/apps/desktop/scripts/publish-haloop-images.mjs --verify-public
